ShortDescription: Honest, Privacy-First Desktop Disk Analyzer and System Maintenance Hub
Description: |
  CleanPilot is a modern, 100% offline desktop disk analyzer, threat hunter, and storage maintenance hub for Windows.
  It strictly rejects fake cleaner patterns, simulated health meters, and telemetry tracking.
  Features include:
  - Multi-pass memory-bounded streaming duplicate detection (SHA-256 Direct ByteBuffer)
  - Developer cache cleaner (node_modules, .gradle/caches, target, .venv)
  - Stealth crypto-miner & LOLBin reverse shell threat hunter
  - Battery degradation and thermal throttling diagnostics
  - Safe native recycle bin deletion delegation
